[package]
name = "amp-rtsp-client"
version = "0.1.0"
authors = ["Mike Olson"]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mwolson/retina"
publish = false
description = "RTSP H.264 client for the native AMP iOS app, wrapping Retina behind a small C ABI"

# Not a member of Retina's workspace: this crate keeps its own Cargo.lock.
[workspace]

[lib]
name = "amp_rtsp_client"
crate-type = ["staticlib", "rlib"]

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2"
retina = { path = "../..", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "sync", "time"] }
url = "2"

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "s"
panic = "unwind"
