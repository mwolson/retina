name: iOS xcframework publish

# Builds AmpRtspClient.xcframework for an amp-rtsp-client-v* tag, attests the
# zip's build provenance, and creates a draft release with the zip and
# SHA256SUMS. A maintainer reviews and publishes the draft by hand. The
# workflow only ever creates a release: if any release (draft or published)
# already exists for the tag, it fails without changing it.

on:
  push:
    tags: ["amp-rtsp-client-v*"]

permissions:
  contents: read

concurrency:
  group: ios-xcframework-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios/amp-rtsp-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --lib --target aarch64-apple-ios -- -D warnings
      - run: cargo test --locked
      - name: License allowlist
        run: |
          python3 ../test_rtsp_client_notices.py
          python3 ../rtsp-client-notices.py --out "$RUNNER_TEMP/notices"

  build:
    needs: check
    runs-on: macos-26
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the crate version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("ios/amp-rtsp-client/Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$GITHUB_REF_NAME" != "amp-rtsp-client-v$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match amp-rtsp-client version $version"
              exit 1
          fi
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      # No dependency cache here: the release build starts from a clean
      # checkout and the locked registry sources only.
      - name: Build
        run: ios/build-xcframework.sh "$RUNNER_TEMP/dist"
      - name: Release notes
        run: |
          python3 - "$RUNNER_TEMP/dist" > "$RUNNER_TEMP/release-notes.md" <<'PY'
          import json, os, sys
          from pathlib import Path

          dist = Path(sys.argv[1])
          manifest = json.loads(Path("ios/build/stage/manifest.json").read_text())
          zip_name = next(dist.glob("*.zip")).name
          digest = (dist / "SHA256SUMS").read_text().split()[0]
          repo = os.environ["GITHUB_REPOSITORY"]
          print(f"""AmpRtspClient.xcframework from amp-rtsp-client {manifest['crate_version']} and Retina {manifest['retina_version']} at {manifest['source_commit']}.

          - Rust: {manifest['rustc']}
          - Xcode: {manifest['xcode']} (iOS SDK {manifest['ios_sdk']})
          - Targets: {', '.join(manifest['targets'])}, iOS deployment target {manifest['ios_deployment_target']}
          - SHA-256 of `{zip_name}`: `{digest}`

          The zip holds the xcframework, `manifest.json` and the license notices in
          `licenses/` that an app linking it must ship.

          Verify a download:

          ```
          shasum -a 256 -c SHA256SUMS
          gh attestation verify {zip_name} --repo {repo} \\
              --signer-workflow {repo}/.github/workflows/ios-xcframework-publish.yml
          ```""")
          PY
          cat "$RUNNER_TEMP/release-notes.md"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            ${{ runner.temp }}/dist/
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Verify checksum
        run: cd release/dist && sha256sum -c SHA256SUMS
      # Draft releases are not visible through the by-tag endpoint, so list
      # them all. Any existing release, draft or published, stops the run:
      # nothing here edits notes or replaces assets. To rebuild a draft,
      # delete it by hand and rerun; a published release is never rebuilt.
      - name: Refuse to change an existing release
        run: |
          existing="$(gh api --paginate "repos/$GH_REPO/releases" |
              jq -rs --arg tag "$GITHUB_REF_NAME" 'add | .[] | select(.tag_name == $tag) | "\(.id) draft=\(.draft)"')"
          if [[ -n "$existing" ]]; then
              echo "::error::a release for $GITHUB_REF_NAME already exists ($existing); delete a draft by hand to rebuild it"
              exit 1
          fi
      - name: Create the draft release
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file release/release-notes.md release/dist/*.zip release/dist/SHA256SUMS
      - name: Check the uploaded assets
        run: |
          gh api --paginate "repos/$GH_REPO/releases" |
              jq -rs --arg tag "$GITHUB_REF_NAME" \
                  '[add | .[] | select(.tag_name == $tag)] | if length == 1 then .[0].assets[] | "\(.digest) \(.name)" else error("expected one release, found \(length)") end' \
              > uploaded.txt
          cat uploaded.txt
          (cd release/dist && sha256sum ./*.zip SHA256SUMS) |
              awk '{ sub(/^\.\//, "", $2); print "sha256:" $1, $2 }' | sort > expected.txt
          sort uploaded.txt | diff expected.txt -
