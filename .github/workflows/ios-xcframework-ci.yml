name: iOS xcframework CI

# Checks and builds ios/amp-rtsp-client without publishing anything. Releases
# come from ios-xcframework-publish.yml on amp-rtsp-client-v* tags.

on:
  push:
    branches: [main, ios-xcframework]
    paths:
      - ".github/workflows/ios-xcframework-*.yml"
      - "Cargo.toml"
      - "ios/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/ios-xcframework-*.yml"
      - "Cargo.toml"
      - "ios/**"
      - "src/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios/amp-rtsp-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ios/amp-rtsp-client -> ../build/target
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --lib --target aarch64-apple-ios -- -D warnings
      - run: cargo test --locked
      - name: License allowlist
        run: python3 ../rtsp-client-notices.py --out "$RUNNER_TEMP/notices"

  build:
    needs: check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build
        run: ios/build-xcframework.sh "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AmpRtspClient-xcframework
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 14
